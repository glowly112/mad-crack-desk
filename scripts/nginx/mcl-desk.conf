# Mad Crack Lab operator desk — cookie gate, live scoreboard. No fuse.
# Install: sudo cp scripts/nginx/mcl-desk.conf /etc/nginx/snippets/mcl-desk.conf
# Include from mad-crack-lab.conf (stridesmart.uk + ACC console).
# Nitro baseURL=/desk/ — assets must proxy to /desk/assets/ on node (not /assets/).

location = /desk { return 302 /desk/; }

location /desk/assets/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8791/desk/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location /desk/portraits/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8791/portraits/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location /desk/maps/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8791/maps/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location /portraits/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8791/portraits/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location /desk/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  # HTML must not cache across deploys — stale shell references 404 chunk hashes.
    add_header Cache-Control "no-cache, must-revalidate" always;
}
